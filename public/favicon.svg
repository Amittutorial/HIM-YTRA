<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="himBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#12372F" />
      <stop offset="100%" stop-color="#091f1a" />
    </linearGradient>
    <linearGradient id="peakGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#C6A15B" />
    </linearGradient>
    <linearGradient id="snowGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#A7F3D0" />
    </linearGradient>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="64" height="64" rx="14" fill="url(#himBg)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#C6A15B" stroke-width="1.5" opacity="0.6"/>

  <!-- Left Mountain Peak -->
  <polygon points="10,50 26,20 42,50" fill="#1F6B55" opacity="0.9"/>
  <!-- Left Mountain Snowcap -->
  <polygon points="26,20 20,31 24,30 26,33 29,30 32,31" fill="url(#snowGrad)"/>

  <!-- Main Center High Mountain Peak -->
  <polygon points="22,50 38,13 54,50" fill="#12372F"/>
  <polygon points="22,50 38,13 54,50" fill="none" stroke="#34D399" stroke-width="1.5" opacity="0.7"/>
  <!-- Main Peak Snowcap -->
  <polygon points="38,13 30,28 35,26 38,30 42,26 46,28" fill="url(#snowGrad)"/>

  <!-- Golden Sun Accent -->
  <circle cx="48" cy="18" r="4.5" fill="url(#peakGold)"/>

  <!-- Compass / Star Accent -->
  <path d="M38 42 L40 46 L44 48 L40 50 L38 54 L36 50 L32 48 L36 46 Z" fill="url(#peakGold)"/>
</svg>
